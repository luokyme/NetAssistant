name: Ubuntu 24.04 release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      tag:
        description: 'Existing release tag to build and publish (for example v1.1.0)'
        required: true
        default: v1.1.0
        type: string

env:
  RELEASE_TAG: ${{ inputs.tag || github.ref_name }}

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
      - name: Validate release tag
        run: |
          [[ "$RELEASE_TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]] || {
            echo "Expected a release tag such as v1.1.0" >&2
            exit 1
          }
      - uses: actions/checkout@v4
        with:
          ref: refs/tags/${{ env.RELEASE_TAG }}
      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential qtbase5-dev qt5-qmake dpkg-dev
      - name: Build release binary
        run: |
          mkdir build
          cd build
          qmake ../NetAssistant.pro CONFIG+=release CONFIG-=debug
          make -j"$(nproc)"
      - name: Run local network regression tests
        env:
          QT_QPA_PLATFORM: offscreen
        run: |
          mkdir build-tests
          cd build-tests
          qmake ../tests/network.pro
          make -j"$(nproc)"
          ./network-tests
      - name: Package
        run: scripts/package-ubuntu.sh "$RELEASE_TAG" build/NetAssistant dist
      - name: Verify installation and startup
        run: |
          sudo apt-get install -y ./dist/*.deb
          set +e
          QT_QPA_PLATFORM=offscreen timeout 3s /usr/bin/NetAssistant
          status=$?
          set -e
          test "$status" -eq 124
      - uses: actions/upload-artifact@v4
        with:
          name: netassistant-ubuntu24.04-amd64
          path: dist/*
          if-no-files-found: error

  publish:
    needs: build
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - name: Validate release tag
        run: |
          [[ "$RELEASE_TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]] || {
            echo "Expected a release tag such as v1.1.0" >&2
            exit 1
          }
      - uses: actions/checkout@v4
        with:
          ref: refs/tags/${{ env.RELEASE_TAG }}
      - uses: actions/download-artifact@v4
        with:
          name: netassistant-ubuntu24.04-amd64
          path: dist
      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if gh release view "$RELEASE_TAG" > /dev/null 2>&1; then
            gh release upload "$RELEASE_TAG" dist/* --clobber
          else
            gh release create "$RELEASE_TAG" dist/* --verify-tag \
              --title "$RELEASE_TAG — Ubuntu 24.04 amd64" \
              --notes-file packaging/release-notes.md
          fi
